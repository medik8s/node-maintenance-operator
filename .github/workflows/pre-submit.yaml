# Understanding the workflow file - https://docs.github.com/en/actions/learn-github-actions/understanding-github-actions#understanding-the-workflow-file
name: Pre Submit # workflow name
on: # on events
  # main* also covers fork branches (main-<topic>), so a push to a fork runs
  # the suite without opening a PR first.
  push:
    branches: [main*, medik8s-*, release-*]
  # Any target branch: main, medik8s-X.Y, release-X.Y, and cherry-pick PRs.
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

# A single run per pull request or branch, superseding any stale one.
concurrency:
  group: pre-submit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs: # jobs to run
  build:
    name: Test and build PRs
    runs-on: ubuntu-24.04 # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#choosing-github-hosted-runners
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run checks and unit tests
      run: make test

    - name: Build images
      run: make container-build-community

  scorecard-k8s:
    name: Test Scorecard Tests # https://sdk.operatorframework.io/docs/testing-operators/scorecard/
    runs-on: ubuntu-24.04
    env:
      # see https://github.com/kubernetes-sigs/kind/tags
      KIND_VERSION: v0.22.0
      # see https://hub.docker.com/r/kindest/node/tags for available versions!
      K8S_VERSION: v1.27.11

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Start kind cluster
      uses: container-tools/kind-action@v2
      with:
        version: ${{env.KIND_VERSION}}
        config: ./hack/kind-scorecard-config.yaml
        node_image: kindest/node:${{env.K8S_VERSION}}
        kubectl_version: ${{env.K8S_VERSION}}
        registry: true

    - name: Cluster info
      run: |
        kubectl version -o=yaml
        kubectl cluster-info
        kubectl get nodes -o=wide

    - name: Build bundle-community
      run: make bundle-community

    - name: Run scorecard tests
      run: OPERATOR_NAMESPACE=default make test-scorecard
